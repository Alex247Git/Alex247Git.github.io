<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250" role="img" aria-label="Alumni Career Map">
  <defs>
    <linearGradient id="m-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123047"/>
      <stop offset="0.55" stop-color="#0a1f30"/>
      <stop offset="1" stop-color="#051018"/>
    </linearGradient>
    <linearGradient id="m-pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#d63a3a"/>
    </linearGradient>
    <radialGradient id="m-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4d9fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="250" fill="url(#m-bg)"/>
  <rect width="500" height="250" fill="url(#m-glow)"/>

  <!-- Map pin -->
  <g transform="translate(250 88)">
    <circle cx="0" cy="-16" r="18" fill="#123047" stroke="#ff6b6b" stroke-width="6"/>
    <circle cx="0" cy="-16" r="5" fill="#fff" opacity="0.9"/>
    <path d="M0 0 L-8 18 L8 18 Z" fill="url(#m-pin)"/>
  </g>

  <text x="250" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Alumni Career Map</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="103" y="192" width="74" height="30" rx="15" fill="#4d9fff" fill-opacity="0.08" stroke="#4d9fff" stroke-opacity="0.55"/>
    <text x="140" y="211" fill="#9cc7ff">PHP</text>

    <rect x="206" y="192" width="88" height="30" rx="15" fill="#4d9fff" fill-opacity="0.08" stroke="#4d9fff" stroke-opacity="0.55"/>
    <text x="250" y="211" fill="#9cc7ff">Leaflet</text>

    <rect x="323" y="192" width="72" height="30" rx="15" fill="#4d9fff" fill-opacity="0.08" stroke="#4d9fff" stroke-opacity="0.55"/>
    <text x="359" y="211" fill="#9cc7ff">Maps</text>
  </g>
</svg>