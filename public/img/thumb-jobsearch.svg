<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="0 0 500 250" role="img" aria-label="Job Search Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="0.55" stop-color="#060d18"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb3ff"/>
      <stop offset="1" stop-color="#2f6fd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#4d9fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4d9fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="250" fill="url(#bg)"/>
  <rect width="500" height="250" fill="url(#glow)"/>

  <g transform="translate(250 92)">
    <rect x="-13" y="-34" width="26" height="18" rx="6" fill="none" stroke="#6fb3ff" stroke-width="4"/>
    <rect x="-28" y="-20" width="56" height="46" rx="7" fill="url(#case)"/>
    <rect x="-8" y="-3" width="16" height="12" rx="3" fill="#0a1626" opacity="0.85"/>
    <rect x="-2" y="0" width="4" height="6" rx="1.5" fill="#9cc7ff"/>
  </g>

  <text x="250" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Job Search Platform</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="108" y="196" width="80" height="30" rx="15" fill="#4d9fff" fill-opacity="0.08" stroke="#4d9fff" stroke-opacity="0.55"/>
    <text x="148" y="215" fill="#9cc7ff">React</text>

    <rect x="202" y="196" width="94" height="30" rx="15" fill="#4d9fff" fill-opacity="0.08" stroke="#4d9fff" stroke-opacity="0.55"/>
    <text x="249" y="215" fill="#9cc7ff">Node.js</text>

    <rect x="310" y="196" width="82" height="30" rx="15" fill="#4d9fff" fill-opacity="0.08" stroke="#4d9fff" stroke-opacity="0.55"/>
    <text x="351" y="215" fill="#9cc7ff">MySQL</text>
  </g>
</svg>
